<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #F7F5F0; color: #14161B; font-family: "DM Sans", system-ui, sans-serif; }
    a { color: #E5484D; } a:hover { color: #B93A3E; }
    .nav { flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F5F0; overflow: hidden; box-sizing: border-box;">
  <div style="flex: 1; min-height: 0; position: relative; overflow: hidden;">
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <dc-import name="Home" go="{{ go }}" accent="{{ accent }}" hint-size="390px,779px"></dc-import>
    </sc-if>
    <sc-if value="{{ isLobby }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Lobby" go="{{ go }}" accent="{{ accent }}" hint-size="390px,779px"></dc-import>
    </sc-if>
    <sc-if value="{{ isMatch }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Match" go="{{ go }}" accent="{{ accent }}" hint-size="390px,779px"></dc-import>
    </sc-if>
    <sc-if value="{{ isStats }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Stats" go="{{ go }}" accent="{{ accent }}" hint-size="390px,779px"></dc-import>
    </sc-if>
  </div>
  <sc-if value="{{ showNav }}" hint-placeholder-val="{{ true }}">
    <div style="flex: none; display: flex; background: #FFFFFF; border-top: 1px solid #E4E0D8;">
      <div class="nav" onClick="{{ goHome }}" style="color: {{ homeColor }};">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
        <span>Home</span>
      </div>
      <div class="nav" style="color: #9AA3B5;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M14.3 15 8.6 5.2M9.7 15 20.6 15M7.4 10.2 13.1 20M12 4h11.4M14.3 9 3.4 9M16.6 13.8 10.9 4M9.7 15l5.7 9.8"></path></svg>
        <span>Lens</span>
      </div>
      <div class="nav" onClick="{{ goStats }}" style="color: {{ statsColor }};">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg>
        <span>Statistik</span>
      </div>
      <div class="nav" style="color: #9AA3B5;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
        <span>Einstellungen</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#E5484D","options":["#E5484D","#1FB58F","#2B6BFF"],"section":"Farbe"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { screen: 'home' };
  }
  renderVals() {
    const s = this.state.screen;
    const go = (screen) => this.setState({ screen });
    return {
      accent: this.props.accent || '#E5484D',
      go,
      isHome: s === 'home', isLobby: s === 'lobby', isMatch: s === 'match', isStats: s === 'stats',
      showNav: s === 'home' || s === 'stats',
      homeColor: s === 'home' ? '#14161B' : '#9AA3B5',
      statsColor: s === 'stats' ? '#14161B' : '#9AA3B5',
      goHome: () => go('home'),
      goStats: () => go('stats'),
    };
  }
}
</script>
</body>
</html>
