<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FreeDarts Remote</title>
<style>
body{margin:0;background:#0A0E17;color:#EEF1F6;font-family:system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;color:#8B95A7}
.top .st{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#8B95A7}
.dot.on{background:#7CF06B}.dot.off{background:#FF5252}.dot.wait{background:#FFC107}
.players{display:flex;gap:12px;padding:0 12px;flex-wrap:wrap}
.p{flex:1 1 260px;background:#141A26;border:1px solid #263042;border-radius:14px;overflow:hidden}
.p.active{border-color:#2F6BFF;box-shadow:0 0 0 2px #2F6BFF inset}
.p .h{background:#1C2331;padding:8px 14px;font-weight:700;letter-spacing:1px}
.p.active .h{background:#2F6BFF}
.p .s{font-size:96px;font-weight:900;padding:6px 14px;line-height:1}
.p .d{padding:0 14px 10px;color:#8B95A7}
.p .legs{float:right;color:#FFC107}
.visit{display:flex;gap:10px;margin:14px 12px;background:#141A26;border:1px solid #263042;border-radius:12px;padding:12px 16px;font-size:24px;font-weight:700}
.visit .sum{margin-left:auto;color:#7CF06B}
.banner{margin:0 12px;padding:10px;border-radius:12px;background:#0F5A34;text-align:center;font-size:26px;font-weight:800}
.chk{color:#7CF06B;text-align:center;font-weight:600;margin:6px}
.hist{padding:0 14px 12px;color:#8B95A7;font-size:14px}
.btns{display:flex;gap:10px;padding:12px}
button{flex:1;background:#1C2331;color:#fff;border:1px solid #263042;border-radius:10px;padding:14px;font-size:18px;cursor:pointer}
button.p{background:#2F6BFF;border-color:#2F6BFF}
button:disabled{opacity:.4;cursor:default}
.join{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.join h1{font-size:28px;margin:0 0 6px}
.join p{color:#8B95A7}
.join input{width:100%;box-sizing:border-box;font-size:28px;letter-spacing:6px;text-align:center;text-transform:uppercase;padding:14px;border-radius:12px;border:1px solid #263042;background:#141A26;color:#fff;margin:14px 0}
.join button{width:100%}
.msg{margin:40px 12px;text-align:center;color:#8B95A7;font-size:18px}
</style>
</head>
<body>
<div id="join" class="join" hidden>
  <h1>FreeDarts Remote</h1>
  <p>Session-Code aus der App eingeben (Einstellungen › Online-Remote).</p>
  <input id="code" maxlength="12" autocomplete="off" placeholder="CODE">
  <button class="p" id="go">Verbinden</button>
</div>
<div id="game" hidden>
  <div class="top"><div id="title">FreeDarts</div><div class="st"><span id="lens"></span><span class="dot" id="dot"></span><span id="status">Verbinde…</span></div></div>
  <div id="banner" class="banner" hidden></div>
  <div id="msg" class="msg" hidden></div>
  <div class="players" id="players"></div>
  <div class="visit" id="visit"></div>
  <div class="chk" id="chk"></div>
  <div class="btns"><button id="undo">Undo</button><button class="p" id="next">Next</button></div>
</div>
<script>
(function(){
  var m = location.pathname.match(/\/b\/([A-Za-z0-9]+)/);
  var code = (m && m[1]) || new URLSearchParams(location.search).get('code') || '';
  code = code.toUpperCase().replace(/[^A-Z0-9]/g,'');
  var $ = function(id){ return document.getElementById(id); };

  if (!code) {
    $('join').hidden = false;
    var go = function(){ var c = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if (c.length >= 4) location.href = '/b/' + c; };
    $('go').onclick = go;
    $('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
    $('code').focus();
    return;
  }

  $('game').hidden = false;
  document.title = 'FreeDarts Remote · ' + code;
  var ws = null, retry = 1000, pingTimer = null, online = false;

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function setStatus(cls, text){ $('dot').className = 'dot ' + cls; $('status').textContent = text; var dis = cls !== 'on'; $('undo').disabled = dis; $('next').disabled = dis; }
  function cmd(c){ if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'cmd', do:c})); }
  $('undo').onclick = function(){ cmd('undo'); };
  $('next').onclick = function(){ cmd('next'); };

  function render(s){
    $('msg').hidden = true;
    $('title').textContent = s.hasGame ? (s.title + ' · ' + s.headline) : 'Kein laufendes Spiel';
    $('lens').textContent = s.lens || '';
    var b = $('banner'); b.hidden = !s.banner; b.textContent = s.banner || '';
    $('players').innerHTML = (s.players || []).map(function(p){
      return '<div class="p' + (p.active ? ' active' : '') + '"><div class="h">' + esc(p.name).toUpperCase() +
        '<span class="legs">' + (p.sets ? ('S ' + p.sets + ' ') : '') + (p.legs ? ('L ' + p.legs) : '') + '</span></div>' +
        '<div class="s">' + esc(p.score) + '</div><div class="d">' + esc(p.detail) + '</div>' +
        '<div class="hist">' + (p.history || []).slice(-5).map(esc).join(' · ') + '</div></div>';
    }).join('');
    var visit = s.visit || [];
    $('visit').innerHTML = [0,1,2].map(function(i){ return '<span>' + esc(visit[i] || '—') + '</span>'; }).join('') + '<span class="sum">' + (s.visitSum || 0) + '</span>';
    $('chk').textContent = s.checkout ? ('Checkout: ' + s.checkout) : '';
  }

  function connect(){
    setStatus('wait', 'Verbinde…');
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws/view/' + code);
    ws.onopen = function(){ retry = 1000; pingTimer = setInterval(function(){ if (ws.readyState === 1) ws.send('ping'); }, 30000); };
    ws.onmessage = function(ev){
      if (ev.data === 'pong') return;
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'state') render(msg.state);
      else if (msg.type === 'online') {
        online = !!msg.online;
        setStatus(online ? 'on' : 'off', online ? 'Board verbunden' : 'Board offline');
        if (!online) { $('msg').hidden = false; $('msg').textContent = 'Das Handy ist gerade nicht verbunden. Die Anzeige aktualisiert sich automatisch, sobald es wieder da ist.'; }
        else $('msg').hidden = true;
      }
    };
    ws.onclose = function(ev){
      clearInterval(pingTimer);
      setStatus('off', ev.code === 1001 ? 'Session abgelaufen' : 'Verbindung verloren');
      if (ev.code === 1001) { $('msg').hidden = false; $('msg').textContent = 'Diese Session ist abgelaufen. In der App Online-Remote erneut einschalten und den neuen Link öffnen.'; return; }
      setTimeout(connect, retry); retry = Math.min(retry * 2, 15000);
    };
    ws.onerror = function(){ try { ws.close(); } catch (e) {} };
  }
  connect();
})();
</script>
</body>
</html>
