<!doctype html>

<helmet>

  <style>
    body { margin: 0; background: #0B1220; color: #F3F5F9; font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .card { background: #171C27; border-radius: 16px; }
    .chip { background: #2A3040; color: #C7CDD8; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 500; }
    .badge { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
    .btn { height: 52px; border-radius: 14px; background: #2B6BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; }
    .btn2 { height: 48px; border-radius: 12px; background: transparent; border: 1px solid #3A4152; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .ribbon { display: inline-flex; align-items: center; gap: 8px; background: #0D1119; color: #FFFFFF; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 16px; letter-spacing: 0.5px; padding: 6px 14px 6px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
    .lvl { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 15px; padding: 6px 16px 6px 12px; margin-left: -8px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
    .muted { color: #9AA3B5; }
  </style>
</helmet>

      <div style="font-size: 16px; font-weight: 700;">(4/17)</div><div class="muted" style="font-size: 11px;">Checkout %</div>
    </div>
