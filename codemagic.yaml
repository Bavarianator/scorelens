# Codemagic (Gratis-Tarif: nur mac_mini_m2, 500 min/Monat). Einrichtung: README → „Cloud-Build mit Codemagic“.
workflows:
  # Jeder Push auf main: kompilieren + Unit-Tests, Debug-APK als Download
  check:
    name: Check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Tests
        script: ./gradlew :app:testDebugUnitTest :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/**

  # Nur manuell („Start new build“): signierte Release-APK an die Firebase-Gruppe beta
  beta:
    name: Beta-Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      # Keine android_signing-Referenz: fehlt sie in Codemagic, blendet Codemagic den ganzen Workflow aus
      groups:
        - firebase # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, GOOGLE_SERVICES_JSON, FIREBASE_SERVICE_ACCOUNT
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Firebase- und Signier-Konfiguration
        script: |
          # Ohne google-services.json baut Gradle ohne Firebase (siehe app/build.gradle.kts)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          # Ohne keystore.properties signiert Gradle mit dem Debug-Key (nicht als Update über die Beta installierbar)
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$CM_BUILD_DIR/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "KEYSTORE_BASE64 fehlt – Release wird debug-signiert"
          fi
      - name: Release-APK
        script: ./gradlew :app:assembleRelease
      # Als Skript statt publishing.firebase: Codemagic verweigert dort die ganze Konfiguration, solange die Variable fehlt
      - name: An Firebase-Gruppe beta verteilen
        script: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "FIREBASE_SERVICE_ACCOUNT fehlt – APK nur als Artefakt"; exit 0; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CM_BUILD_DIR/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/firebase-sa.json" npx -y firebase-tools appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk --app 1:980894619589:android:c9567e92cc4e0672135dac --groups beta
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
